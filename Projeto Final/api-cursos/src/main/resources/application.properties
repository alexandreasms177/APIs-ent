spring.application.name=api-cursos
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cursos}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.student.name=${APP_STUDENT_NAME:Aluno}
app.student.ra=${APP_STUDENT_RA:NAO_INFORMADO}
